<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand px-3 py-3">
      <span class="brand-mark"><i class="bi bi-tree"></i></span>
      <span class="fw-bold">CampingManager</span>
    </div>

    <nav class="nav flex-column gap-1 px-2">
      <a
        *ngFor="let item of navigationItems"
        class="nav-link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      >
        <i class="bi {{ item.icon }}"></i>
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div>
        <div class="small app-muted">Area amministrativa</div>
        <div class="fw-semibold">{{ user?.email }}</div>
      </div>
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>
        Logout
      </button>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
