<div
  class="field-card"
  [class.active]="isOpen"
  (click)="toggleDropdown($event)"
>
  <i class="bi bi-people icon-align"></i>
  <div class="field-content">
    <label>{{ "BOOKING.GUESTS" | translate }}</label>
    <span class="field-value">{{ summary }}</span>
  </div>

  <div
    class="guests-dropdown"
    *ngIf="isOpen"
    (click)="$event.stopPropagation()"
  >
    <div class="guest-row">
      <div class="guest-info">
        <span class="guest-title">{{ "BOOKING.ADULTS" | translate }}</span>
        <span class="guest-subtitle">{{ "BOOKING.AGE_13_PLUS" | translate }}</span>
      </div>
      <div class="guest-counter">
        <button
          type="button"
          class="btn-counter"
          [disabled]="adultsCount <= 1"
          (click)="emitClick($event, decrementAdults)"
        >
          <i class="bi bi-dash"></i>
        </button>
        <span class="counter-val">{{ adultsCount }}</span>
        <button
          type="button"
          class="btn-counter"
          [disabled]="adultsCount >= 12"
          (click)="emitClick($event, incrementAdults)"
        >
          <i class="bi bi-plus"></i>
        </button>
      </div>
    </div>

    <div class="guest-row">
      <div class="guest-info">
        <span class="guest-title">{{ "BOOKING.CHILDREN" | translate }}</span>
        <span class="guest-subtitle">{{ "BOOKING.AGE_0_12" | translate }}</span>
      </div>
      <div class="guest-counter">
        <button
          type="button"
          class="btn-counter"
          [disabled]="childrenCount <= 0"
          (click)="emitClick($event, decrementChildren)"
        >
          <i class="bi bi-dash"></i>
        </button>
        <span class="counter-val">{{ childrenCount }}</span>
        <button
          type="button"
          class="btn-counter"
          [disabled]="childrenCount >= 12"
          (click)="emitClick($event, incrementChildren)"
        >
          <i class="bi bi-plus"></i>
        </button>
      </div>
    </div>
  </div>
</div>
