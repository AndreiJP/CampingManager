<section class="reviews-wrapper py-5">
  <div class="container">
    <div class="section-header text-center mb-5">
      <span class="badge rounded-pill mb-2">Opinioni degli ospiti</span>
      <h2>Cosa dicono di noi</h2>
      <div class="google-rating mt-2">
        <span class="rating-val">4.8</span>
        <div class="stars ms-2">
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-half"></i>
        </div>
        <span class="reviews-count ms-2">Basato su 150+ recensioni Google</span>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6" *ngFor="let review of reviews">
        <div class="review-card h-100 shadow-sm">
          <div class="card-body">
            <div class="author-info mb-3">
              <img [src]="review.authorPhotoUrl" [alt]="review.authorName" class="author-img">
              <div class="ms-3">
                <h5 class="author-name mb-0">{{ review.authorName }}</h5>
                <span class="review-date">{{ review.relativeTimeDescription }}</span>
              </div>
              <i class="bi bi-google google-icon ms-auto"></i>
            </div>
            
            <div class="rating-stars mb-3">
              <i class="bi bi-star-fill text-warning" *ngFor="let star of getStars(review.rating)"></i>
              <i class="bi bi-star text-warning" *ngFor="let star of getEmptyStars(review.rating)"></i>
            </div>

            <p class="review-text">"{{ review.text }}"</p>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-5">
      <a href="https://www.google.com/maps" target="_blank" class="btn btn-google">
        <i class="bi bi-google me-2"></i> Vedi tutte le recensioni su Google
      </a>
    </div>
  </div>
</section>
