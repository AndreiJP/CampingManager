<nav class="navbar navbar-expand-lg site-navbar" id="top" *ngIf="config$ | async as config">
  <div class="container-xxl">
    <a class="navbar-brand site-brand" href="#top" [attr.aria-label]="config.siteName + ' home'">
      <span class="site-brand-mark">
        <i class="bi" [ngClass]="config.logoIcon"></i>
      </span>
      <span>{{ config.siteName }}</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#siteNavigation"
      aria-controls="siteNavigation"
      aria-expanded="false"
      aria-label="Apri menu"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="siteNavigation">
      <ul class="navbar-nav mx-lg-auto align-items-lg-center gap-lg-3">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active">Chi Siamo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/activities" routerLinkActive="active">Attività</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/gallery" routerLinkActive="active">Galleria</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/rules" routerLinkActive="active">Regolamento</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contatti</a>
        </li>
      </ul>

      <div class="site-actions">
        <button class="btn btn-link site-language" type="button" aria-label="Lingua italiano">
          <span class="flag-dot"></span>
          IT
          <i class="bi bi-chevron-down"></i>
        </button>
        <a class="btn site-booking-btn" href="#availability">
          <i class="bi bi-calendar-event"></i>
          Prenota ora
        </a>
      </div>
    </div>
  </div>
</nav>
