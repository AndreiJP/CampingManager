<nav
  class="navbar navbar-expand-lg site-navbar"
  id="top"
  *ngIf="config$ | async as config"
>
  <div class="container-xxl">
    <a
      class="navbar-brand site-brand"
      href="#top"
      [attr.aria-label]="('SITE.NAME' | translate) + ' home'"
    >
      <span class="site-brand-mark">
        <i class="bi" [ngClass]="config.logoIcon"></i>
      </span>
      <span>{{ "SITE.NAME" | translate }}</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#siteNavigation"
      aria-controls="siteNavigation"
      aria-expanded="false"
      aria-label="Apri menu"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="siteNavigation">
      <ul class="navbar-nav mx-lg-auto align-items-lg-center gap-lg-3">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ "NAVBAR.HOME" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active">
            {{ "NAVBAR.ABOUT" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/activities" routerLinkActive="active">
            {{ "NAVBAR.ACTIVITIES" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/gallery" routerLinkActive="active">
            {{ "NAVBAR.GALLERY" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/rules" routerLinkActive="active">
            {{ "NAVBAR.RULES" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active">
            {{ "NAVBAR.CONTACT" | translate }}
          </a>
        </li>
      </ul>

      <div class="site-actions">
        <div class="dropdown d-inline-block me-2">
          <button
            class="btn btn-link site-language dropdown-toggle"
            type="button"
            id="languageDropdown"
            (click)="toggleDropdown($event)"
            [attr.aria-expanded]="showDropdown"
          >
            <span
              class="flag-dot"
              [ngClass]="currentLang === 'it' ? 'flag-it' : 'flag-en'"
            ></span>
            {{ currentLang | uppercase }}
            <i class="bi bi-chevron-down ms-1"></i>
          </button>
          <ul
            class="dropdown-menu dropdown-menu-end"
            [class.show]="showDropdown"
            aria-labelledby="languageDropdown"
          >
            <li>
              <button
                class="dropdown-item d-flex align-items-center gap-2"
                (click)="changeLanguage('it')"
                [class.active]="currentLang === 'it'"
              >
                <span class="flag-dot flag-it"></span>
                <span class="lang-label">IT</span>
              </button>
            </li>
            <li>
              <button
                class="dropdown-item d-flex align-items-center gap-2"
                (click)="changeLanguage('en')"
                [class.active]="currentLang === 'en'"
              >
                <span class="flag-dot flag-en"></span>
                <span class="lang-label">EN</span>
              </button>
            </li>
          </ul>
        </div>
        <a class="btn site-booking-btn" href="#availability">
          <i class="bi bi-calendar-event"></i>
          {{ "NAVBAR.BOOK_NOW" | translate }}
        </a>
      </div>
    </div>
  </div>
</nav>
