<app-page-header
  title="Dashboard"
  subtitle="Panoramica operativa dell area amministrativa."
></app-page-header>

<div class="row g-3">
  <div class="col-md-6 col-xl-3" *ngFor="let card of cards">
    <a class="card h-100 text-decoration-none text-body" [routerLink]="card.route">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <span class="badge badge-soft">{{ card.title }}</span>
          <i class="bi {{ card.icon }} fs-4 text-primary"></i>
        </div>
        <p class="mb-0 app-muted">{{ card.text }}</p>
      </div>
    </a>
  </div>
</div>
