<div
  class="field-card"
  [class.active]="isOpen"
  [class.has-error]="hasError"
  (click)="toggleCalendar($event)"
>
  <i class="bi bi-calendar3 icon-align"></i>
  <div class="field-content">
    <label>{{ label }}</label>
    <span class="field-value">
      {{ (value | date: "dd MMM yyyy") || "Scegli data" }}
    </span>
  </div>

  <div
    class="calendar-dropdown"
    *ngIf="isOpen"
    (click)="$event.stopPropagation()"
  >
    <div class="calendar-header">
      <button
        type="button"
        class="btn-month-nav"
        (click)="changeMonth(-1, $event)"
      >
        <i class="bi bi-chevron-left"></i>
      </button>
      <span class="calendar-month-year">{{ monthName }} {{ year }}</span>
      <button
        type="button"
        class="btn-month-nav"
        (click)="changeMonth(1, $event)"
      >
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>

    <div class="calendar-weekdays">
      <span *ngFor="let dayName of weekdayNames">{{ dayName }}</span>
    </div>

    <div class="calendar-grid">
      <button
        type="button"
        *ngFor="let day of days"
        class="calendar-day"
        [class.other-month]="!day.isCurrentMonth"
        [class.today]="day.isToday"
        [class.selected]="day[selectedClass]"
        [class.range]="day.isInRange"
        [disabled]="day.isDisabled"
        (click)="selectDay(day, $event)"
      >
        {{ day.dayNum }}
      </button>
    </div>
  </div>
</div>
